border:1px dashed #9c93d8;background:white;font-size:22px}.photo-editor{grid-column:1/-1;display:flex!important;align-items:center;gap:14px;border:1px dashed #c9c4e5;border-radius:12px;padding:12px!important}.photo-editor .preview{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--mint);color:var(--teal);font-size:20px}.photo-editor img{width:100%;height:100%;object-fit:cover}.photo-editor input{border:0!important;padding:4px!important;margin:2px 0 0!important;outline:0!important}@media(max-width:650px){.work>.top{grid-template-columns:1fr}.top>div{grid-column:1/-1}.profile-pills{max-width:100%;width:100%;order:3}.profile-pill{width:57px!important}.profile-pill .photo{width:44px;height:44px}.search{order:2}.content{padding-top:20px}}
</style></head><body><aside class="side"><div class="brand"><i>+</i><div><b>My Health</b><small>Personal medical portal</small></div></div><nav id="nav"></nav><div class="privacy"><b>Private family cloud</b><p>Records sync securely after an authorized Google sign-in.</p></div></aside><main class="work"><header class="top"><b class="mobile">+ My Health</b><input class="search" id="search" placeholder="Search medicines, doctors or tests"><div class="profile-pills" id="profilePills"></div><select id="memberSelect" hidden aria-hidden="true"></select></header><div class="content" id="app"></div></main><nav class="bottom" id="bottom"></nav><div id="modal"></div><div id="authGate" class="auth-gate"><section class="auth-card"><div class="auth-mark">+</div><p>PRIVATE FAMILY HEALTH RECORD</p><h1>My Health Portal</h1><span id="authMessage">Checking your secure session…</span><button id="googleSignIn" type="button" hidden>Continue with Google</button></section></div><script>
const seed={members:[{id:'me',name:'My Profile',relation:'Self',dob:'',blood:'',contact:'',allergies:'',conditions:''}],medicines:[],doctors:[],tests:[]};const legacyDb=JSON.parse(localStorage.getItem('healthPortalSingle')||'null');let db=seed,member=db.members[0].id,tab='overview',query='';const $=s=>document.querySelector(s),uid=()=>Date.now()+Math.random().toString(36),save=()=>window.cloudSave?window.cloudSave(db):Promise.resolve(),fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}):'Not set',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['overview','⌂','Overview'],['medicines','✚','Medicines'],['doctors','♙','Doctors'],['tests','▣','Tests & results'],['profile','♡','Health profile']];function rows(k){return db[k].filter(x=>x.memberId===member)}function current(){return db.members.find(x=>x.id===member)||db.members[0]}function initials(n){return String(n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}function avatar(x){return x.photo?`<img src="${x.photo}" alt="">`:initials(x.name)}function chooseProfile(id){member=id;render()}function nav(){const h=tabs.map(x=>`<button class="${tab==x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');$('#nav').innerHTML=h;$('#bottom').innerHTML=tabs.map(x=>`<button class="${tab==x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2].split(' ')[0]}</button>`).join('');$('#profilePills').innerHTML=db.members.map(x=>`<button class="profile-pill ${x.id==member?'selected':''}" onclick="chooseProfile('${x.id}')" title="Open ${esc(x.name)} profile"><span class="photo">${avatar(x)}</span><small>${esc(x.name)}</small></button>`).join('')+`<button class="profile-pill add-profile" onclick="openForm('member')" title="Add family member"><span class="photo">+</span><small>Add</small></button>`}function go(x){tab=x;query='';$('#search').value='';render()}function heading(title,text,add=''){return `<div class="heading"><div><div class="eyebrow">PERSONAL HEALTH RECORD</div><h1>${esc(title)}</h1><p>${esc(text)}</p></div>${add?`<button class="primary" onclick="openForm('${add}')">+ Add record</button>`:''}</div>`}function empty(t,p){return `<div class="empty"><i>+</i><b>${t}</b><p>${p}</p></div>`}
function render(){nav();if(query)return renderSearch();const p=current(),m=rows('medicines'),d=rows('doctors'),t=rows('tests');let h=heading(tab=='overview'?`Welcome, ${p.name}`:{medicines:'Medicines',doctors:'Doctors',tests:'Tests & results',profile:'Health profile'}[tab],{overview:'Your family health information, organized in one place.',medicines:'Track prescriptions, doses and schedules.',doctors:'Keep your care team and appointments together.',tests:'Record medical tests and important results.',profile:'Maintain key medical details for emergencies and visits.'}[tab],!['overview','profile'].includes(tab)?tab.slice(0,-1):'');if(tab=='overview'){const a=m.filter(x=>x.status=='Active');h+=`<div class="stats"><button class="stat" onclick="go('medicines')"><i>✚</i><b>${a.length}<small>Active medicines</small></b></button><button class="stat" onclick="go('doctors')"><i>♙</i><b>${d.length}<small>Doctors</small></b></button><button class="stat" onclick="go('tests')"><i>▣</i><b>${t.length}<small>Tests recorded</small></b></button></div><div class="grid"><section class="panel">${panelHead('Current medicines','medicine')}${a.length?a.map(x=>mini(x,'medicine',x.name+' '+x.strength,x.schedule)).join(''):empty('No active medicines','Add a medicine to begin tracking prescriptions.')}</section><section class="panel">${panelHead('Coming up')}${upcoming(d,t)||empty('Nothing scheduled','Future appointments and tests will appear here.')}</section></div><section class="quick"><div><h2>Quick actions</h2><p>Add a new record in a few seconds.</p></div><div><button onclick="openForm('medicine')">✚ Add medicine</button><button onclick="openForm('doctor')">♙ Add doctor</button><button onclick="openForm('test')">▣ Add test</button></div></section>`}else if(tab=='profile')h+=profile(p);else h+=recordList(tab,tab=='medicines'?m:tab=='doctors'?d:t);$('#app').innerHTML=h}
function panelHead(t,a=''){return `<div class="panel-head"><div><h2>${t}</h2><p>Information for this family member</p></div>${a?`<button onclick="openForm('${a}')">+ Add</button>`:''}</div>`}function mini(x,k,title,sub){return `<button class="mini" onclick="openForm('${k}','${x.id}')"><i class="record-icon">Rx</i><b>${esc(title)}<small>${esc(sub||'Not recorded')}</small></b><em>›</em></button>`}function upcoming(d,t){return [...d.filter(x=>x.nextVisit).map(x=>({...x,date:x.nextVisit,kind:'doctor',label:'Appointment with '+x.name})),...t.filter(x=>x.status=='Scheduled').map(x=>({...x,kind:'test',label:x.name}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(x=>`<button class="mini" onclick="openForm('${x.kind}','${x.id}')"><b>${esc(x.label)}<small>${fmt(x.date)} · ${esc(x.specialty||x.facility||x.status)}</small></b></button>`).join('')}
function recordList(k,a){if(!a.length)return empty('No records yet','Use the Add record button to create your first entry.');return `<div class="list">${a.map(x=>`<article class="record"><i class="record-icon">${k=='medicines'?'Rx':k=='doctors'?esc(x.name[0]):'▣'}</i><div><h3>${esc(x.name)} <small>${esc(x.strength||x.specialty||'')}</small></h3><p>${esc(k=='medicines'?(x.schedule||'Schedule not set')+' · '+(x.purpose||'Purpose not recorded'):k=='doctors'?(x.clinic||'Clinic not recorded')+' · '+(x.phone||'Phone not recorded'):(x.result||'No result entered')+' · '+fmt(x.date))}</p><span class="meta">${esc(x.status||x.facility||'')}</span></div><div class="actions"><button onclick="openForm('${k.slice(0,-1)}','${x.id}')">Edit</button><button onclick="del('${k}','${x.id}')">Delete</button></div></article>`).join('')}</div>`}
function profile(p){return `<div class="profile"><section class="panel"><div class="person"><i>${esc(p.name[0])}</i><div><h2>${esc(p.name)}</h2><p>${esc(p.relation)}</p></div><button class="secondary" onclick="openForm('member','${p.id}')">Edit profile</button></div><div class="details">${[['Date of birth',fmt(p.dob)],['Blood type',p.blood||'Not recorded'],['Emergency contact',p.contact||'Not recorded'],['Allergies',p.allergies||'None recorded'],['Health conditions',p.conditions||'None recorded']].map(x=>`<div><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('')}</div></section><section class="panel">${panelHead('Family members','member')}<div class="family">${db.members.map(x=>`<div><button onclick="member='${x.id}';render()"><b>${esc(x.name)}</b><small>${esc(x.relation)}</small></button><button onclick="deleteMember('${x.id}')">×</button></div>`).join('')}</div></section><section class="panel backup"><h2>Backup and restore</h2><p>Download a private copy of all records and store it somewhere secure.</p><button class="primary" onclick="backup()">Download backup</button><label class="secondary">Restore backup<input type="file" accept="application/json" onchange="restore(this.files[0])"></label><aside><b>Important privacy note</b><br>GitHub hosts only the portal. Your medical records stay in this browser. Clearing browser data removes them unless you have a backup.</aside></section></div>`}

function showGate(message,showButton=true){gate.classList.remove('ready');authMessage.textContent=message;signInButton.hidden=!showButton}
function hideGate(){gate.classList.add('ready')}
function toast(message){let box=document.getElementById('syncToast');if(!box){box=document.createElement('div');box.id='syncToast';box.className='sync-toast';document.body.appendChild(box)}box.textContent=message;box.classList.add('show');clearTimeout(syncTimer);syncTimer=setTimeout(()=>box.classList.remove('show'),1800)}
function accountCard(user){let card=document.getElementById('accountCard');if(!card){card=document.createElement('section');card.id='accountCard';card.className='account-card';const side=document.querySelector('.side'),privacy=side.querySelector('.privacy');side.insertBefore(card,privacy)}card.innerHTML=`<small>Family cloud account</small><b>${esc(user.email)}</b><button id="portalSignOut">Sign out</button>`;document.getElementById('portalSignOut').onclick=()=>signOut(auth)}
function removeAccountCard(){document.getElementById('accountCard')?.remove()}

async function resizeDataUrl(dataUrl){if(!String(dataUrl||'').startsWith('data:image/'))return dataUrl;return new Promise(resolve=>{const image=new Image();image.onload=()=>{const max=320,scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.76))};image.onerror=()=>resolve('');image.src=dataUrl})}
async function prepareForCloud(source){const clean=JSON.parse(JSON.stringify(source));for(const profile of clean.members)if(profile.photo)profile.photo=await resizeDataUrl(profile.photo);return clean}
async function writeCloud(source,message='Saved to family cloud'){
  if(!signedInUser)return;
  const clean=await prepareForCloud(source),bytes=new Blob([JSON.stringify(clean)]).size;
  if(bytes>900000){alert('This record set is too large for Firestore. Remove one or more profile photos and try again.');throw new Error('Firestore document size safety limit reached')}
  await setDoc(familyRef,{records:clean,updatedAt:serverTimestamp(),updatedBy:signedInUser.email});
  db=clean;cloudHasData=true;localStorage.removeItem('healthPortalSingle');toast(message)
}
window.cloudSave=source=>writeCloud(source);
window.portalSignOut=()=>signOut(auth);
window.importBrowserRecords=async()=>{if(!hasRecords(legacyDb))return alert('No previous browser records were found on this device. Use Import downloaded backup instead.');if(cloudHasData&&!confirm('This will replace the family cloud records with the records saved in this browser. Continue?'))return;try{await writeCloud(legacyDb,'Existing records imported');member=db.members[0].id;render()}catch(error){console.error(error);alert('The records could not be imported. Please try again.')}};
window.importBackupFile=file=>{if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{const value=JSON.parse(reader.result);if(!validDatabase(value))throw new Error('Invalid backup');if(cloudHasData&&!confirm('This will replace the current family cloud records with this backup. Continue?'))return;await writeCloud(value,'Backup imported to family cloud');member=db.members[0].id;render()}catch(error){console.error(error);alert('The backup could not be imported. Please confirm that it is a My Health backup file.')}};reader.readAsText(file)};

const originalRestore=restore;
restore=file=>window.importBackupFile(file);
const originalSetPhoto=setPhoto;
setPhoto=profileId=>{const picker=document.createElement('input');picker.type='file';picker.accept='image/*';picker.onchange=async()=>{const file=picker.files?.[0];if(!file)return;if(file.size>5000000)return alert('Please choose an image smaller than 5 MB.');const reader=new FileReader();reader.onload=async()=>{const profile=db.members.find(x=>x.id===profileId);if(!profile)return;profile.photo=await resizeDataUrl(reader.result);await save();render()};reader.readAsDataURL(file)};picker.click()};

const cloudProfile=profile;
profile=p=>{let html=cloudProfile(p);html=html.replace('Backup and restore','Family cloud and backup').replace('Download a private copy of all records and store it somewhere secure.','Your records sync automatically for both authorized Google accounts. You can also keep an offline backup.').replace('Restore backup<input','Import backup to family cloud<input').replace('<aside><b>Important privacy note</b><br>GitHub hosts only the portal. Your medical records stay in this browser. Clearing browser data removes them unless you have a backup.</aside>',`<div class="migration-actions"><button class="secondary" onclick="importBrowserRecords()">Import records from this browser</button><label class="secondary">Import downloaded backup<input type="file" accept="application/json" onchange="importBackupFile(this.files[0])"></label></div><aside><b>Cloud synchronization</b><br>Both authorized accounts see the same family records on every signed-in device. GitHub hosts only the portal code.</aside>`);return html};

function safeDriveUrl(value){try{const url=new URL(value);return url.protocol==='https:'&&(url.hostname==='drive.google.com'||url.hostname==='docs.google.com')?url.href:''}catch{return''}}
function medicineStatus(item){const status=item.status||'Active',labels={Active:'Active',Paused:'Paused',Replaced:'Replaced · No longer taking',Discontinued:'Discontinued · No longer taking',Completed:'Completed'},css={Active:'active',Paused:'paused',Replaced:'replaced',Discontinued:'discontinued',Completed:'completed'};return `<span class="medicine-status status-${css[status]||'discontinued'}">${esc(labels[status]||status)}</span>${status==='Replaced'&&item.replacedBy?`<span class="replacement-note">Now taking: ${esc(item.replacedBy)}</span>`:''}`}
recordList=function(kind,items){if(!items.length)return empty('No records yet','Use the Add record button to create your first entry.');return `<div class="list">${items.map(item=>{const report=kind==='tests'?safeDriveUrl(item.reportUrl):'',summary=kind==='medicines'?(item.schedule||'Schedule not set')+' · '+(item.purpose||'Purpose not recorded'):kind==='doctors'?(item.clinic||'Clinic not recorded')+' · '+(item.phone||'Phone not recorded'):(item.result||'No result entered')+' · '+fmt(item.date),inactive=kind==='medicines'&&(item.status||'Active')!=='Active';return `<article class="record ${inactive?'medicine-inactive':''}"><i class="record-icon">${kind==='medicines'?'Rx':kind==='doctors'?esc(item.name?.[0]||'D'):'▣'}</i><div><h3>${esc(item.name)} <small>${esc(item.strength||item.specialty||'')}</small></h3><p>${esc(summary)}</p>${kind==='medicines'?medicineStatus(item):`<span class="meta">${esc(item.status||item.facility||'')}</span>`}</div><div class="actions">${report?`<a class="drive-report" href="${esc(report)}" target="_blank" rel="noopener">${esc(item.reportName||'View report')}</a>`:''}<button onclick="openForm('${kind.slice(0,-1)}','${item.id}')">Edit</button><button onclick="del('${kind}','${item.id}')">Delete</button></div></article>`}).join('')}</div>`};

signInButton.onclick=async()=>{signInButton.disabled=true;authMessage.textContent='Opening Google Sign-In…';try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(error){console.error(error);authMessage.textContent=error.code==='auth/popup-blocked'?'Your browser blocked the sign-in window. Allow pop-ups and try again.':'Google Sign-In was not completed. Please try again.';signInButton.hidden=false;signInButton.disabled=false}};

onAuthStateChanged(auth,user=>{
  if(stopCloudListener){stopCloudListener();stopCloudListener=null}
  signedInUser=null;removeAccountCard();
  if(!user){showGate('Sign in with an authorized family Google account.');signInButton.disabled=false;return}
  if(!isAuthorized(user)){showGate(`Access is not enabled for ${user.email}. Please use one of the two authorized family accounts.`,true);signOut(auth);return}
  signedInUser=user;accountCard(user);authMessage.textContent='Loading your family records…';signInButton.hidden=true;
  stopCloudListener=onSnapshot(familyRef,snapshot=>{
    cloudHasData=snapshot.exists()&&validDatabase(snapshot.data()?.records);
    db=cloudHasData?snapshot.data().records:seed;
    if(!db.members.length)db.members=[...seed.members];
    if(!db.members.some(x=>x.id===member))member=db.members[0].id;
    hideGate();render();
    if(!cloudHasData&&hasRecords(legacyDb))setTimeout(()=>{if(confirm('Existing records were found in this browser. Import them to the shared family cloud now?'))window.importBrowserRecords()},250)
  },error=>{console.error(error);showGate(error.code==='permission-denied'?'Firestore access was denied. Publish the family security rules provided with this version, then refresh the page.':'The family records could not be loaded. Check your internet connection and try again.',false)})
});

/* =====================================================================
   GLASSMORPHISM LAYER — frosted translucent surfaces floating over an
   animated aurora. Override-only: no HTML, JS or original CSS touched.
   ===================================================================== */
:root{--glass:rgba(255,255,255,.42);--glass-hi:rgba(255,255,255,.64);--glass-line:rgba(255,255,255,.72);--glass-shadow:0 8px 32px rgba(20,50,90,.14);--blur:blur(22px) saturate(170%)}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0) scale(1)}50%{transform:translate3d(3%,-4%,0) rotate(8deg) scale(1.1)}100%{transform:translate3d(-4%,3%,0) rotate(-6deg) scale(1.05)}}
@keyframes floatOrb{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-30px,40px,0) rotate(12deg)}}
@keyframes floatOrb2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(40px,-36px,0)}}
@keyframes sheen{0%,55%{left:-70%}100%{left:140%}}

/* ---------- Aurora backdrop + floating glass orbs ---------- */
body{background:linear-gradient(135deg,#EBF1F7 0%,#EDF3F8 48%,#EAF2F3 100%) fixed}
body:after{inset:-25%;width:auto;height:auto;right:auto;bottom:auto;border-radius:0;opacity:1;filter:blur(34px);
background:radial-gradient(38% 38% at 18% 22%,#5AA9D6B3,transparent 70%),radial-gradient(34% 34% at 82% 16%,#3F7FD0A6,transparent 70%),radial-gradient(40% 40% at 72% 84%,#4FB0B899,transparent 70%),radial-gradient(30% 30% at 22% 80%,#9CC7E8B3,transparent 70%);
animation:aurora 30s ease-in-out infinite alternate}
html:before,html:after{content:'';position:fixed;z-index:-1;border-radius:50%;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 60px rgba(60,110,230,.18),inset 0 0 40px rgba(255,255,255,.55)}
html:before{top:9%;right:7%;width:300px;height:300px;animation:floatOrb 18s ease-in-out infinite}
html:after{bottom:6%;left:24%;width:210px;height:210px;animation:floatOrb2 22s ease-in-out infinite}
.content{background-image:none}
.work:before,.content:after{opacity:.3}

/* ---------- Frosted cards ---------- */
.panel,.stat,.record,.overview-inline,.care-doctor,.doctor-card,.family div,.photo-editor{background:var(--glass)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line)!important;box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.28)!important}
.panel .record,.overview-inline .record,.panel .family div{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.4)!important;box-shadow:0 4px 14px rgba(20,50,90,.08),inset 0 1px 0 rgba(255,255,255,.9)!important}
.panel:hover,.overview-inline:hover,.stat:hover,.record:hover,.care-doctor:hover,.doctor-card:hover{background:var(--glass-hi)!important;box-shadow:0 22px 50px rgba(20,50,90,.2),0 0 0 1px var(--s2,rgba(255,255,255,.95)),inset 0 1px 0 #fff!important}
.stat.inline-active{background:linear-gradient(135deg,rgba(255,255,255,.78),color-mix(in srgb,var(--c1,#2F7BD0) 24%,rgba(255,255,255,.5)))!important}
.health-tabs .stat{background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none}
.health-tabs .stat.inline-active{background:rgba(255,255,255,.78)!important;box-shadow:0 6px 18px rgba(20,50,90,.15),inset 0 1px 0 #fff!important}
.quick{background-image:linear-gradient(120deg,rgba(90,169,214,.3),rgba(255,255,255,.45),rgba(76,155,214,.28),rgba(111,155,214,.26))!important;background-color:transparent!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line)!important;box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.95)!important;position:relative;overflow:hidden}
.quick:after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sheen 7s ease-in-out infinite;pointer-events:none}
.care-doctor:after{background:radial-gradient(circle,rgba(156,199,232,.35),transparent 68%)}
.mini:hover{background:rgba(255,255,255,.45)}
.empty{background:rgba(255,255,255,.3);border-radius:18px}

/* ---------- Glass sidebar ---------- */
.side{background:linear-gradient(165deg,rgba(23,52,92,.66),rgba(14,36,66,.58) 52%,rgba(10,27,50,.5))!important;-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border-right:1px solid rgba(255,255,255,.32);box-shadow:14px 0 50px rgba(20,60,110,.2),inset -1px 0 0 rgba(255,255,255,.18)}

.panel-head button,.secondary,.actions button,.quick button,.health-area-head button,.modal footer button,.health-tabs .add-area-tab{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(20,50,90,.08),inset 0 1px 0 #fff}
