</style></head><body><aside class="side"><div class="brand"><i>+</i><div><b>My Health</b><small>Personal medical portal</small></div></div><nav id="nav"></nav><div class="privacy"><b>Private on this device</b><p>Your records stay in this browser unless you export them.</p></div></aside><main class="work"><header class="top"><b class="mobile">+ My Health</b><input class="search" id="search" placeholder="Search medicines, doctors or tests"><div class="profile-pills" id="profilePills"></div><select id="memberSelect" hidden aria-hidden="true"></select></header><div class="content" id="app"></div></main><nav class="bottom" id="bottom"></nav><div id="modal"></div><script>
const seed={members:[{id:'me',name:'My Profile',relation:'Self',dob:'',blood:'',contact:'',allergies:'',conditions:''}],medicines:[],doctors:[],tests:[]};let db=JSON.parse(localStorage.getItem('healthPortalSingle')||'null')||seed,member=db.members[0].id,tab='overview',query='';const $=s=>document.querySelector(s),uid=()=>Date.now()+Math.random().toString(36),save=()=>localStorage.setItem('healthPortalSingle',JSON.stringify(db)),fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}):'Not set',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['overview','⌂','Overview'],['medicines','✚','Medicines'],['doctors','♙','Doctors'],['tests','▣','Tests & results'],['profile','♡','Health profile']];function rows(k){return db[k].filter(x=>x.memberId===member)}function current(){return db.members.find(x=>x.id===member)||db.members[0]}function initials(n){return String(n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}function avatar(x){return x.photo?`<img src="${x.photo}" alt="">`:initials(x.name)}function chooseProfile(id){member=id;render()}function nav(){const h=tabs.map(x=>`<button class="${tab==x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');$('#nav').innerHTML=h;$('#bottom').innerHTML=tabs.map(x=>`<button class="${tab==x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2].split(' ')[0]}</button>`).join('');$('#profilePills').innerHTML=db.members.map(x=>`<button class="profile-pill ${x.id==member?'selected':''}" onclick="chooseProfile('${x.id}')" title="Open ${esc(x.name)} profile"><span class="photo">${avatar(x)}</span><small>${esc(x.name)}</small></button>`).join('')+`<button class="profile-pill add-profile" onclick="openForm('member')" title="Add family member"><span class="photo">+</span><small>Add</small></button>`}function go(x){tab=x;query='';$('#search').value='';render()}function heading(title,text,add=''){return `<div class="heading"><div><div class="eyebrow">PERSONAL HEALTH RECORD</div><h1>${esc(title)}</h1><p>${esc(text)}</p></div>${add?`<button class="primary" onclick="openForm('${add}')">+ Add record</button>`:''}</div>`}function empty(t,p){return `<div class="empty"><i>+</i><b>${t}</b><p>${p}</p></div>`}
function render(){nav();if(query)return renderSearch();const p=current(),m=rows('medicines'),d=rows('doctors'),t=rows('tests');let h=heading(tab=='overview'?`Welcome, ${p.name}`:{medicines:'Medicines',doctors:'Doctors',tests:'Tests & results',profile:'Health profile'}[tab],{overview:'Your family health information, organized in one place.',medicines:'Track prescriptions, doses and schedules.',doctors:'Keep your care team and appointments together.',tests:'Record medical tests and important results.',profile:'Maintain key medical details for emergencies and visits.'}[tab],!['overview','profile'].includes(tab)?tab.slice(0,-1):'');if(tab=='overview'){const a=m.filter(x=>x.status=='Active');h+=`<div class="stats"><button class="stat" onclick="go('medicines')"><i>✚</i><b>${a.length}<small>Active medicines</small></b></button><button class="stat" onclick="go('doctors')"><i>♙</i><b>${d.length}<small>Doctors</small></b></button><button class="stat" onclick="go('tests')"><i>▣</i><b>${t.length}<small>Tests recorded</small></b></button></div><div class="grid"><section class="panel">${panelHead('Current medicines','medicine')}${a.length?a.map(x=>mini(x,'medicine',x.name+' '+x.strength,x.schedule)).join(''):empty('No active medicines','Add a medicine to begin tracking prescriptions.')}</section><section class="panel">${panelHead('Coming up')}${upcoming(d,t)||empty('Nothing scheduled','Future appointments and tests will appear here.')}</section></div><section class="quick"><div><h2>Quick actions</h2><p>Add a new record in a few seconds.</p></div><div><button onclick="openForm('medicine')">✚ Add medicine</button><button onclick="openForm('doctor')">♙ Add doctor</button><button onclick="openForm('test')">▣ Add test</button></div></section>`}else if(tab=='profile')h+=profile(p);else h+=recordList(tab,tab=='medicines'?m:tab=='doctors'?d:t);$('#app').innerHTML=h}
function panelHead(t,a=''){return `<div class="panel-head"><div><h2>${t}</h2><p>Information for this family member</p></div>${a?`<button onclick="openForm('${a}')">+ Add</button>`:''}</div>`}function mini(x,k,title,sub){return `<button class="mini" onclick="openForm('${k}','${x.id}')"><i class="record-icon">Rx</i><b>${esc(title)}<small>${esc(sub||'Not recorded')}</small></b><em>›</em></button>`}function upcoming(d,t){return [...d.filter(x=>x.nextVisit).map(x=>({...x,date:x.nextVisit,kind:'doctor',label:'Appointment with '+x.name})),...t.filter(x=>x.status=='Scheduled').map(x=>({...x,kind:'test',label:x.name}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(x=>`<button class="mini" onclick="openForm('${x.kind}','${x.id}')"><b>${esc(x.label)}<small>${fmt(x.date)} · ${esc(x.specialty||x.facility||x.status)}</small></b></button>`).join('')}
function recordList(k,a){if(!a.length)return empty('No records yet','Use the Add record button to create your first entry.');return `<div class="list">${a.map(x=>`<article class="record"><i class="record-icon">${k=='medicines'?'Rx':k=='doctors'?esc(x.name[0]):'▣'}</i><div><h3>${esc(x.name)} <small>${esc(x.strength||x.specialty||'')}</small></h3><p>${esc(k=='medicines'?(x.schedule||'Schedule not set')+' · '+(x.purpose||'Purpose not recorded'):k=='doctors'?(x.clinic||'Clinic not recorded')+' · '+(x.phone||'Phone not recorded'):(x.result||'No result entered')+' · '+fmt(x.date))}</p><span class="meta">${esc(x.status||x.facility||'')}</span></div><div class="actions"><button onclick="openForm('${k.slice(0,-1)}','${x.id}')">Edit</button><button onclick="del('${k}','${x.id}')">Delete</button></div></article>`).join('')}</div>`}
function profile(p){return `<div class="profile"><section class="panel"><div class="person"><i>${esc(p.name[0])}</i><div><h2>${esc(p.name)}</h2><p>${esc(p.relation)}</p></div><button class="secondary" onclick="openForm('member','${p.id}')">Edit profile</button></div><div class="details">${[['Date of birth',fmt(p.dob)],['Blood type',p.blood||'Not recorded'],['Emergency contact',p.contact||'Not recorded'],['Allergies',p.allergies||'None recorded'],['Health conditions',p.conditions||'None recorded']].map(x=>`<div><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('')}</div></section><section class="panel">${panelHead('Family members','member')}<div class="family">${db.members.map(x=>`<div><button onclick="member='${x.id}';render()"><b>${esc(x.name)}</b><small>${esc(x.relation)}</small></button><button onclick="deleteMember('${x.id}')">×</button></div>`).join('')}</div></section><section class="panel backup"><h2>Backup and restore</h2><p>Download a private copy of all records and store it somewhere secure.</p><button class="primary" onclick="backup()">Download backup</button><label class="secondary">Restore backup<input type="file" accept="application/json" onchange="restore(this.files[0])"></label><aside><b>Important privacy note</b><br>GitHub hosts only the portal. Your medical records stay in this browser. Clearing browser data removes them unless you have a backup.</aside></section></div>`}
function renderSearch(){let all=[...rows('medicines').map(x=>({...x,kind:'medicine'})),...rows('doctors').map(x=>({...x,kind:'doctor'})),...rows('tests').map(x=>({...x,kind:'test'}))].filter(x=>Object.values(x).join(' ').toLowerCase().includes(query.toLowerCase()));$('#app').innerHTML=heading(`Results for “${query}”`,`${all.length} matching records`)+`<div class="list">${all.map(x=>`<button class="record" onclick="openForm('${x.kind}','${x.id}')"><b>${esc(x.name)}</b><span>${esc(x.specialty||x.strength||x.result||x.status)}</span></button>`).join('')||empty('No matching records','Try another medicine, doctor, clinic or test name.')}</div>`}
